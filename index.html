<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ár Rincí Céilí — Concise Set</title>
<style>
  @font-face {
    font-family: 'Georgia-fallback';
    src: local('Georgia');
  }

  :root{
    --green-deep: #1F3D2E;
    --green-mid: #2C5240;
    --parchment: #F1E9D8;
    --parchment-dark: #E6DAC0;
    --brass: #B8863C;
    --brass-light: #D4A85E;
    --rust: #8B3A2B;
    --ink: #2A241C;
    --ink-soft: #55483A;
    --line: rgba(42,36,28,0.16);
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse at 20% -10%, #2d5a41 0%, transparent 55%),
      radial-gradient(ellipse at 90% 110%, #17301f 0%, transparent 50%),
      var(--green-deep);
    font-family: Georgia, 'Times New Roman', serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  .sans{ font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }

  .wrap{
    max-width: 620px;
    margin: 0 auto;
    padding: 28px 18px 56px;
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }

  /* ---------- Header ---------- */
  header{
    text-align:center;
    margin-bottom: 32px;
    color: var(--parchment);
  }
  header .eyebrow-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-bottom: 6px;
  }
  header .eyebrow-row .rule{
    height:1px;
    width:34px;
    background: var(--brass-light);
    opacity:.6;
  }
  header .eyebrow{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--brass-light);
    font-weight:600;
  }
  header h1{
    font-size: clamp(26px, 6vw, 34px);
    margin: 2px 0 2px;
    font-weight: 400;
    letter-spacing: 0.01em;
  }
  header .subtitle{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 13.5px;
    color: #C9D8CC;
    margin: 0;
  }

  /* ---------- Card stage ---------- */
  .stage{
    position:relative;
    flex: 1;
    display:flex;
    align-items:center;
    justify-content:center;
    perspective: 1800px;
    min-height: 480px;
  }

  .card{
    width:100%;
    max-width: 500px;
    aspect-ratio: 5/7;
    position:relative;
    transform-style:preserve-3d;
    transition: transform 0.55s cubic-bezier(.3,.1,.2,1);
    cursor:pointer;
  }
  .card.flipped{ transform: rotateY(180deg); }

  .face{
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    border-radius: 6px;
    box-shadow: 0 18px 50px rgba(0,0,0,0.45), 0 2px 0 rgba(255,255,255,0.4) inset;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    background: var(--parchment);
    border: 1px solid rgba(0,0,0,0.08);
  }
  .face::before{
    /* paper texture via subtle noise-like gradient */
    content:"";
    position:absolute; inset:0;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.015) 0px, transparent 1px, transparent 2px),
      radial-gradient(ellipse at top left, rgba(255,255,255,0.5), transparent 60%);
    pointer-events:none;
  }
  .face .spine{
    position:absolute;
    left:0; top:0; bottom:0;
    width: 14px;
    background: linear-gradient(90deg, var(--brass) 0%, var(--brass-light) 40%, transparent 100%);
    opacity:0.85;
  }

  .back{ transform: rotateY(180deg); }

  /* ---- Front face content ---- */
  .front-inner{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 34px 30px;
    position:relative;
  }
  .card-number{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size:11px;
    letter-spacing:0.16em;
    color: var(--brass);
    font-weight:700;
    margin-bottom: 18px;
  }
  .irish-name{
    font-size: clamp(24px, 6.4vw, 32px);
    font-style: italic;
    color: var(--ink);
    line-height:1.18;
    margin: 0 0 10px;
  }
  .divider-flourish{
    width: 46px;
    height: 1px;
    background: var(--rust);
    margin: 12px auto;
    position:relative;
  }
  .divider-flourish::before, .divider-flourish::after{
    content:"";
    position:absolute;
    top:-2.5px;
    width:5px; height:5px;
    border-radius:50%;
    background: var(--rust);
  }
  .divider-flourish::before{ left:-8px; }
  .divider-flourish::after{ right:-8px; }
  .english-name{
    font-size: clamp(17px, 4.2vw, 21px);
    color: var(--ink-soft);
    font-weight:400;
    margin: 0;
  }
  .tap-hint{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    position:absolute;
    bottom: 22px;
    left:0; right:0;
    text-align:center;
    font-size: 11px;
    letter-spacing:0.08em;
    color: var(--ink-soft);
    opacity: 0.55;
  }

  /* ---- Back face content ---- */
  .back-inner{
    flex:1;
    display:flex;
    flex-direction:column;
    padding: 22px 22px 16px 30px;
    overflow-y:auto;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  .back-header{
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--line);
  }
  .back-header .en{
    font-family: Georgia, serif;
    font-size: 19px;
    color: var(--ink);
    margin: 0 0 1px;
  }
  .back-header .ir{
    font-family: Georgia, serif;
    font-style: italic;
    font-size: 13px;
    color: var(--ink-soft);
    margin:0;
  }

  .meta-grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 12px;
    margin-bottom: 14px;
  }
  .meta-item{
    background: rgba(255,255,255,0.4);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 7px 9px;
  }
  .meta-item .k{
    font-size: 9.5px;
    letter-spacing: 0.09em;
    color: var(--rust);
    font-weight:700;
    display:block;
    margin-bottom:2px;
  }
  .meta-item .v{
    font-size: 12px;
    color: var(--ink);
    line-height:1.35;
  }
  .meta-item.full{ grid-column: 1 / -1; }

  .movements-label{
    font-size: 10.5px;
    letter-spacing: 0.1em;
    color: var(--brass);
    font-weight:700;
    margin: 4px 0 8px;
  }

  .movement{
    padding: 8px 0;
    border-bottom: 1px dashed var(--line);
  }
  .movement:last-child{ border-bottom:none; }
  .movement-concise{ padding: 6px 0; }
  .movement-concise .movement-head{ margin-bottom:0; }
  .movement-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap: 8px;
    margin-bottom: 2px;
  }
  .movement-title{
    font-size: 12.5px;
    font-weight:700;
    color: var(--ink);
  }
  .movement-title .ir{
    font-family: Georgia, serif;
    font-style: italic;
    font-weight: 400;
    color: var(--ink-soft);
    font-size: 11.5px;
  }
  .movement-bars{
    font-size: 10.5px;
    color: var(--parchment);
    background: var(--green-mid);
    padding: 1px 7px;
    border-radius: 999px;
    white-space:nowrap;
    flex-shrink:0;
  }
  .movement-desc{
    font-size: 11.5px;
    color: var(--ink-soft);
    line-height:1.45;
  }

  .total-bars{
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--line);
    font-size: 11.5px;
    color: var(--ink);
    font-weight:600;
  }
  .total-bars span{
    font-weight:400;
    color:var(--ink-soft);
  }

  .notes{
    margin-top: 10px;
    font-size: 11px;
    color: var(--ink-soft);
    font-style: italic;
    line-height:1.4;
  }

  /* scrollbar styling for back */
  .back-inner::-webkit-scrollbar{ width:6px; }
  .back-inner::-webkit-scrollbar-thumb{ background: var(--brass); border-radius:3px; }
  .back-inner::-webkit-scrollbar-track{ background: transparent; }

  /* ---------- Nav ---------- */
  .nav{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 18px;
    margin-top: 22px;
  }
  .nav-btn{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    width:44px; height:44px;
    border-radius:50%;
    border: 1px solid rgba(241,233,216,0.3);
    background: rgba(241,233,216,0.08);
    color: var(--parchment);
    font-size:18px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: background .15s ease, transform .1s ease;
  }
  .nav-btn:hover{ background: rgba(241,233,216,0.18); }
  .nav-btn:active{ transform: scale(0.94); }
  .nav-btn:disabled{ opacity:0.3; cursor:default; }

  .counter{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--parchment);
    font-size: 13px;
    min-width: 90px;
    text-align:center;
  }
  .counter .cur{ color: var(--brass-light); font-weight:700; }

  .shuffle-btn{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background:none;
    border: 1px solid rgba(241,233,216,0.3);
    color: var(--parchment);
    font-size:12px;
    padding: 8px 16px;
    border-radius: 999px;
    cursor:pointer;
    margin-top: 14px;
    align-self:center;
    transition: background .15s ease;
  }
  .shuffle-btn:hover{ background: rgba(241,233,216,0.12); }

  @media (max-width: 420px){
    .meta-grid{ grid-template-columns: 1fr; }
    .stage{ min-height: 440px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow-row">
      <div class="rule"></div>
      <div class="eyebrow sans">AN COIMISIÚN LE RINCÍ GAELACHA</div>
      <div class="rule"></div>
    </div>
    <h1>Ár Rincí Céilí</h1>
    <p class="subtitle">Concise Set</p>
  </header>

  <div class="stage">
    <div class="card" id="card">
      <div class="face front">
        <div class="spine"></div>
        <div class="front-inner">
          <div class="card-number" id="cardNum">DANCE No. 1</div>
          <div class="irish-name" id="irishName">Ballaí Luimní</div>
          <div class="divider-flourish"></div>
          <div class="english-name" id="englishName">Walls of Limerick</div>
          <div class="tap-hint sans">TAP TO REVEAL MOVEMENTS</div>
        </div>
      </div>
      <div class="face back">
        <div class="spine"></div>
        <div class="back-inner" id="backContent"></div>
      </div>
    </div>
  </div>

  <div class="nav">
    <button class="nav-btn" id="prevBtn" aria-label="Previous">&#8592;</button>
    <div class="counter sans"><span class="cur" id="curIdx">1</span> / <span id="totIdx">30</span></div>
    <button class="nav-btn" id="nextBtn" aria-label="Next">&#8594;</button>
  </div>

  <button class="shuffle-btn" id="shuffleBtn">Shuffle deck</button>

</div>

<script>const DANCES = [{"num": 1, "irish": "Ballaí Luimní", "english": "Walls of Limerick", "type": "Progressive", "time": "Reel time (2/4)", "dancers": "Any number of couples (sets of 2 couples facing)", "formation": "Two lines, couples facing each other; gent on lady's left, lady's left hand in gent's right", "movements": [["1. Advance and Retire", "Ar Aghaidh is ar gCúl", "Couples advance towards each other (2), retire (2), repeat (4)", "8 bars"], ["2. Half Right and Left", "Trasna Leath-thaobh", "Ladies sidestep & exchange places (4 - two threes); gents sidestep & exchange (4)", "8 bars"], ["3. Dance with Opposite", "Fir is Mná Thall", "Gents sidestep with opposite lady's right hand (4), sidestep back (4)", "8 bars"], ["4. Swing Around", "Luascadh Timpeall", "Couples swing around each other anti-clockwise, revolve to new position", "8 bars"]], "totalBars": 32, "notes": "Simplest of all céilí dances. Leading couple stands idle each time it reaches the end of the line.", "isHandDance": false}, {"num": 2, "irish": "Cor Aontroma", "english": "Antrim Reel", "type": "Progressive", "time": "Reel time (2/4)", "dancers": "Any number of couples (sets of 2 couples)", "formation": "Two lines, couples facing; gent's left hand under lady's right", "movements": [["1. Advance and Return", "Ar Aghaidh is Filleadh", "Advance & retire, repeat", "8 bars"], ["2. Right and Left Half Turn", "Leathchasadh Deasóige is Ciotóige", "Half turn right hand, half turn left hand", "8 bars"], ["3. Sidestep and Heyes", "Leaththaobh agus Athrú Áiteanna", "Sidestep and change places", "8 bars"], ["4. Down the Centre", "Síos i Lár Baill", "Top couple sidestep down centre and back", "8 bars"], ["5. Right Hands Across", "Deasóga is Ciotóga Trasna", "Right hands across, then left hands across back", "8 bars"], ["6. Sidestep with Opposite", "Anonn le Chéile", "Sidestep across with opposite dancer", "8 bars"], ["7. Left and Right Hands Across", "Ciotóga agus Deasóga Trasna", "Left hands across first, then right", "8 bars"], ["8. Swing Around", "Luascadh Timpeall", "Swing around to exchange places with opposite couple", "8 bars"]], "totalBars": 64, "notes": "Same progression logic as Walls of Limerick.", "isHandDance": false}, {"num": 3, "irish": "Briseadh na Carraige", "english": "Siege of Carrick", "type": "Progressive (couples; originally danced as a 4-hand)", "time": "Jig time (6/8) — danced to \"Haste to the Wedding\"", "dancers": "Any number of couples (sets of 2 couples)", "formation": "Same as Walls of Limerick", "movements": [["1. Ring", "Céim an Fháinne", "Ring of 4 sidestep clockwise (4), anti-clockwise & release (4)", "8 bars"], ["2. Right & Left Hands Across", "Deasóga is Ciotóga Trasna", "Right hands across clockwise (4), left hands across anti-clockwise (4)", "8 bars"], ["3. Down Centre and Turn", "Síos i Lár Baill agus Casadh", "Top/bottom exchange (2), retire (2), clap twice (1), link right arm & turn (3)", "8 bars"], ["4. Up Centre and Swing", "Suas i Lár Baill agus Luascadh", "Bottom/top exchange (2), retire (2), clap twice (1), link right arm & swing to new couple (3)", "8 bars"]], "totalBars": 32, "notes": "Each part of the tune played twice so the claps in movements 3 & 4 land correctly. Progression as in Walls of Limerick.", "isHandDance": false}, {"num": 4, "irish": "Réicí Mhala", "english": "Rakes of Mallow", "type": "Progressive (trios)", "time": "Reel time (2/4) — no sidestep in this dance", "dancers": "Any number of trios (gent with 2 ladies on his right)", "formation": "Unusual formation: lines of trios facing each other (OOX / XOO)", "movements": [["1. Advance and Retire", "Ar Aghaidh is ar gCúl", "Lines of 3 advance (2), retire (2), repeat (4)", "8 bars"], ["2. Swing with Opposite Lady", "Luascadh le Cailín Thall", "Gent swings opposite lady; centre lady stationary", "8 bars"], ["3. Swing with Lady on Right", "Luascadh le Cailín ar Dheis", "Gent swings lady on his right; outer lady stationary", "8 bars"], ["4. Link Arms in Centre", "Uillinn in Uillinn", "Two gents link right arm & turn (4), left arm & turn back between ladies (4)", "8 bars"], ["5. Swing Around", "Luascadh Timpeall", "Trios form ring, swing around anti-clockwise to exchange with next trio", "8 bars"]], "totalBars": 40, "notes": "Composed by Fr. Lorcan Ó Muireadhaigh for a céilí where girls outnumbered boys.", "isHandDance": false}, {"num": 5, "irish": "Port an Fhómhair", "english": "Harvest Time Jig", "type": "Progressive (trios)", "time": "Jig time (6/8)", "dancers": "Any number of trios in a line, gent between two ladies", "formation": "Lines of OXO facing another line of OXO", "movements": [["1. Advance and Retire", "Ar Aghaidh is ar gCúl", "Lines of 3 advance (2), retire (2), repeat (4)", "8 bars"], ["2. Sides", "Na Cliatháin", "Sidestep right, finish with rising step (4); sidestep back (4)", "8 bars"], ["3. Right and Left Hands Across", "Deasóga agus Ciotóga Trasna", "Sets of 6 give right hands across, dance clockwise (4); left hands across back (4)", "8 bars"], ["4. Sides (left first)", "Na Cliatháin", "As movement 2, sidestep left first", "8 bars"], ["5. Left and Right Hands Across", "Ciotóga agus Deasóga Trasna", "As movement 3, left hands first", "8 bars"], ["6. Step and Turn", "Céim is Cas Timpeall", "Gent faces lady right, sink-and-grind step twice (4), full turn with right hand (4); repeat facing lady left (8)", "16 bars"], ["7. Advance, Retire & Pass Through", "Ar Aghaidh, ar gCúl agus Tríd", "Trios advance/retire (4); pass through opposite line, right shoulder to right (4)", "8 bars"]], "totalBars": 72, "notes": "Repeat with each successive set.", "isHandDance": false}, {"num": 6, "irish": "Ionsaí na hInse", "english": "Siege of Ennis", "type": "Progressive", "time": "Jig time (6/8)", "dancers": "Any number, sets of 2 couples in a line facing another set of 2 couples", "formation": "Lines of 4 (OXOX) facing another line of 4 (XOXO)", "movements": [["1. Advance and Retire", "Ar Aghaidh is ar gCúl", "Lines of 4 advanc  "—"]], "totalBars": "Opening + Body + 3 Figures + Finish", "notes": "Originated in Co. Armagh.", "isHandDance": true}, {"num": 28, "irish": "Na Trí Fionn", "english": "The Three Tunes", "type": "Eight-hand", "time": "Three different tunes: Haste to the Wedding (Jig), Leslie's Hornpipe, The German Beau (Reel) — reel slower than jig, hornpipe slowest", "dancers": "Four couples", "formation": "Ring, all holding hands", "movements": [["1. Ring", "Céim an Fháinne", "Sidestep clockwise finishing two threes (4), back (4); anti-clockwise repeat", "8+ bars — danced to Haste to the Wedding"]], "totalBars": "Multiple movements across the three tunes", "notes": "Originated in Co. Armagh. Each tune's tempo differs — reel slower than jig, hornpipe slowest of all.", "isHandDance": true}, {"num": 29, "irish": "Geataí Dhoire", "english": "Gates of Derry", "type": "Eight-hand", "time": "Single Jig time", "dancers": "Four couples", "formation": "Two lines, partners facing (favourite tune: The Quaker's Wife)", "movements": [["Note", "", "Ordinary simple threes must be performed throughout — skip threes not permitted at competition/feiseanna", "—"]], "totalBars": "Standard eight-hand structure", "notes": "Originated in Co. Derry. Favourite tune: The Quaker's Wife.", "isHandDance": true}, {"num": 30, "irish": "Cor Seisear Déag", "english": "Sixteen Hand Reel", "type": "Sixteen-hand (Lead Around, Body, 3 Figures, Finish)", "time": "Reel time", "dancers": "Eight couples (Tops 1&2, Sides 3&4, Second Tops 5&6, Second Sides 7&8)", "formation": "Large square/diamond set of 8 couples", "movements": [["Lead Around", "Gabháil Timpeall", "As Eight Hand Reel", "16 bars"], ["Body 1: Sides", "Na Cliatháin", "Change places, gents behind (4), back gents in front (4)", "8 bars"], ["Body 2: Hands Around", "Fáinne", "Couples 1-4 ring with couple on right, sidestep clockwise (4), anti-clockwise & release (4)", "8 bars"], ["Body 3: Sides (repeat)", "Na Cliatháin", "As movement 1", "8 bars"], ["Body 4: Hands Around (left)", "Fáinne", "Couples 1-4 ring with couple on left, sidestep clockwise (4), anti-clockwise & release (4)", "8 bars"], ["Body 5: Half Chain", "Slabhra Leath Slí", "Gents anti-clockwise, ladies clockwise, chain to meet partner (12), lead around back to place (4)", "16 bars"], ["Body 6: Link Arms", "Uillinn in Uillinn", "Gents 1-4 link right arm & circle (4); hand-turns with ladies left/right (4); swing with couple on left (8)", "16 bars"], ["Figure 1: Advance and Retire", "An Chéad Fhigiúr", "As Eight Hand Reel, performed by couples 1&2, 3&4, 5&6, 7&8 in turn", "16 bars"], ["Figure 2: Right Hand to Opposite Lady", "An Dara Figiúr / Deas Lámha Anonn", "Gents exchange hand-turns with opposite lady and partner (2+2+2+2), link arms in centre (3+3), return & swing (2+8)", "24 bars"], ["Figure 3: Arch Arms", "An Triú Figiúr / Lámha in Airde", "Couples swing across (4), form arch to exchange ladies/gents (4), swing across again (4), form arch other way (4), swing to place (8)", "24 bars"], ["Finish", "An Deireadh", "As Eight Hand Reel", "40 bars"]], "totalBars": "Body repeated between each Figure; each Figure performed by all four couple-pairs in turn", "notes": "The most elaborate céilí dance in the collection — for eight couples in a square/diamond formation.", "isHandDance": true}];</script>
<script>
  let deck = DANCES.slice();
  let index = 0;
  let flipped = false;


  const cardEl = document.getElementById('card');
  const cardNum = document.getElementById('cardNum');
  const irishName = document.getElementById('irishName');
  const englishName = document.getElementById('englishName');
  const backContent = document.getElementById('backContent');
  const curIdx = document.getElementById('curIdx');
  const totIdx = document.getElementById('totIdx');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const shuffleBtn = document.getElementById('shuffleBtn');


  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, m => ({
      '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
    }[m]));
  }

  function renderBack(d){
    let html = '';
    html += `<div class="back-header">
      <div class="en">${escapeHtml(d.english)}</div>
      <div class="ir">${escapeHtml(d.irish)}</div>
    </div>`;

    html += `<div class="meta-grid">
      <div class="meta-item"><span class="k">TYPE</span><span class="v">${escapeHtml(d.type)}</span></div>
      <div class="meta-item"><span class="k">MUSIC</span><span class="v">${escapeHtml(d.time)}</span></div>
      <div class="meta-item full"><span class="k">DANCERS</span><span class="v">${escapeHtml(d.dancers)}</span></div>
    </div>`;

    html += `<div class="movements-label">MOVEMENTS &amp; BARS</div>`;
    d.movements.forEach(m => {
      const [title, irish, desc, bars] = m;
      html += `<div class="movement movement-concise">
        <div class="movement-head">
          <div class="movement-title">${escapeHtml(title)}</div>
          <div class="movement-bars">${escapeHtml(bars)}</div>
        </div>
      </div>`;
    });

    html += `<div class="total-bars">Total: ${escapeHtml(String(d.totalBars))}</div>`;
    return html;
  }

  function render(){
    const d = deck[index];
    cardNum.textContent = `DANCE No. ${d.num}`;
    irishName.textContent = d.irish;
    englishName.textContent = d.english;
    backContent.innerHTML = renderBack(d);
    curIdx.textContent = index + 1;
    totIdx.textContent = deck.length;
    prevBtn.disabled = index === 0;
    nextBtn.disabled = index === deck.length - 1;
    if(flipped){
      cardEl.classList.remove('flipped');
      flipped = false;
    }
    backContent.scrollTop = 0;
  }

  function go(delta){
    const newIndex = index + delta;
    if(newIndex < 0 || newIndex >= deck.length) return;
    index = newIndex;
    render();
  }

  cardEl.addEventListener('click', () => {
    flipped = !flipped;
    cardEl.classList.toggle('flipped', flipped);
  });

  prevBtn.addEventListener('click', (e) => { e.stopPropagation(); go(-1); });
  nextBtn.addEventListener('click', (e) => { e.stopPropagation(); go(1); });

  shuffleBtn.addEventListener('click', () => {
    for(let i = deck.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i+1));
      [deck[i], deck[j]] = [deck[j], deck[i]];
    }
    index = 0;
    render();
  });

  document.addEventListener('keydown', (e) => {
    if(e.key === 'ArrowRight') go(1);
    if(e.key === 'ArrowLeft') go(-1);
    if(e.key === ' '){ e.preventDefault(); cardEl.click(); }
  });

  render();
</script>
</body>
</html>
