<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Ár Rincí Céilí — Flashcards</title>
<style>
  :root {
    --ink: #17182B;
    --paper: #F5F3EE;
    --coral: #FF5A4E;
    --coral-text: #D6402E;
    --teal: #1F9E93;
    --gold: #F5B942;
    --gold-text: #B8760B;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    min-height: 100vh;
    background: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  .serif { font-family: 'Archivo Black', Georgia, 'Times New Roman', serif; }

  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 28px 18px 48px;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* ---------- Header ---------- */
  header {
    text-align: center;
    margin-bottom: 26px;
    color: var(--paper);
  }
  header .eyebrow {
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--gold);
    font-weight: 700;
    margin-bottom: 6px;
  }
  header h1 {
    font-family: 'Archivo Black', sans-serif;
    font-size: clamp(26px, 6vw, 36px);
    margin: 4px 0 2px;
    color: var(--paper);
    letter-spacing: -0.01em;
  }
  header .subtitle {
    font-size: 13.5px;
    color: #C9CBD8;
    margin: 0;
  }

  /* ---------- Card stage ---------- */
  .stage {
    position: relative;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 1800px;
    min-height: 480px;
  }

  .card {
    width: 100%;
    max-width: 500px;
    aspect-ratio: 5/7;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.55s cubic-bezier(.3,.1,.2,1);
    cursor: pointer;
  }
  .card.flipped { transform: rotateY(180deg); }

  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: 10px;
    box-shadow: 0 18px 50px rgba(0,0,0,0.45);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    background: var(--paper);
    border: 1px solid rgba(0,0,0,0.08);
  }
  .face .spine {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 10px;
    background: linear-gradient(180deg, var(--coral) 0%, var(--gold) 50%, var(--teal) 100%);
  }

  .back { transform: rotateY(180deg); }

  /* ---- Front face content ---- */
  .front-inner {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 34px 30px;
    position: relative;
  }
  .card-number {
    font-size: 11px;
    letter-spacing: 0.16em;
    color: var(--coral-text);
    font-weight: 800;
    margin-bottom: 18px;
  }
  .irish-name {
    font-family: 'Archivo Black', sans-serif;
    font-size: clamp(22px, 6vw, 30px);
    color: var(--ink);
    line-height: 1.15;
    margin: 0 0 10px;
  }
  .divider-flourish {
    width: 46px;
    height: 3px;
    background: var(--teal);
    border-radius: 2px;
    margin: 12px auto;
  }
  .english-name {
    font-size: clamp(17px, 4.2vw, 21px);
    color: var(--ink);
    opacity: 0.7;
    font-weight: 600;
    margin: 0;
  }
  .tap-hint {
    position: absolute;
    bottom: 22px;
    left: 0; right: 0;
    text-align: center;
    font-size: 11px;
    letter-spacing: 0.08em;
    font-weight: 700;
    color: var(--ink);
    opacity: 0.4;
  }

  /* ---- Back face content ---- */
  .back-inner {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 22px 22px 16px 28px;
    overflow-y: auto;
  }
  .back-header {
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 2px solid var(--ink);
    border-bottom-opacity: 0.1;
    border-bottom: 2px solid rgba(23,24,43,0.1);
  }
  .back-header .en {
    font-family: 'Archivo Black', sans-serif;
    font-size: 19px;
    color: var(--ink);
    margin: 0 0 2px;
  }
  .back-header .ir {
    font-size: 13px;
    color: var(--ink);
    opacity: 0.6;
    font-style: italic;
    margin: 0;
  }

  .meta-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 12px;
    margin-bottom: 14px;
  }
  .meta-item {
    background: rgba(255,255,255,0.5);
    border: 1px solid rgba(23,24,43,0.12);
    border-radius: 6px;
    padding: 7px 9px;
  }
  .meta-item .k {
    font-size: 9.5px;
    letter-spacing: 0.09em;
    color: var(--coral-text);
    font-weight: 800;
    display: block;
    margin-bottom: 2px;
  }
  .meta-item .v {
    font-size: 12px;
    color: var(--ink);
    line-height: 1.35;
  }
  .meta-item.full { grid-column: 1 / -1; }

  .movements-label {
    font-size: 10.5px;
    letter-spacing: 0.1em;
    color: var(--teal);
    font-weight: 800;
    margin: 4px 0 8px;
  }

  .movement-concise { padding: 6px 0; border-bottom: 1px dashed rgba(23,24,43,0.12); }
  .movement-concise:last-child { border-bottom: none; }
  .movement-nested { padding-left: 14px; }
  .section-heading {
    font-size: 11.5px;
    font-weight: 800;
    letter-spacing: 0.04em;
    color: var(--paper);
    background: var(--ink);
    padding: 4px 10px;
    border-radius: 5px;
    margin: 12px 0 6px;
    display: inline-block;
  }
  .section-heading:first-child { margin-top: 2px; }
  .body-repeat-note {
    margin-top: 10px;
    padding: 8px 10px;
    background: rgba(31,158,147,0.1);
    border-left: 3px solid var(--teal);
    border-radius: 4px;
    font-size: 11px;
    color: var(--ink);
    opacity: 0.85;
    line-height: 1.4;
    font-style: italic;
  }
  .movement-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
  }
  .movement-title {
    font-size: 12.5px;
    font-weight: 800;
    color: var(--ink);
  }
  .movement-bars {
    font-size: 10.5px;
    color: var(--paper);
    background: var(--ink);
    padding: 2px 8px;
    border-radius: 999px;
    white-space: nowrap;
    flex-shrink: 0;
    font-weight: 700;
  }

  .total-bars {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid rgba(23,24,43,0.12);
    font-size: 11.5px;
    color: var(--ink);
    font-weight: 700;
  }
  .total-bars span { font-weight: 400; opacity: 0.7; }

  .back-inner::-webkit-scrollbar { width: 6px; }
  .back-inner::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 3px; }
  .back-inner::-webkit-scrollbar-track { background: transparent; }

  /* ---- Note card (front) ---- */
  .note-front-title {
    font-family: 'Archivo Black', sans-serif;
    font-size: clamp(19px, 5vw, 24px);
    color: var(--ink);
    line-height: 1.2;
  }

  /* ---- Note card (back) — headed sections, plain bullets ---- */
  .note-heading {
    font-family: 'Archivo Black', sans-serif;
    font-size: 17px;
    color: var(--ink);
    line-height: 1.2;
    margin-bottom: 4px;
    padding-bottom: 10px;
    border-bottom: 2px solid rgba(23,24,43,0.1);
  }
  .note-section-title {
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 800;
    color: var(--gold-text);
    margin: 14px 0 6px;
  }
  .note-section-title:first-of-type {
    margin-top: 12px;
  }
  .note-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin: 0;
    padding: 0;
  }
  .note-list li {
    position: relative;
    padding-left: 15px;
    font-size: 12.5px;
    line-height: 1.45;
    color: var(--ink);
  }
  .note-list li::before {
    content: "";
    position: absolute;
    left: 0; top: 6px;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--teal);
  }


  /* ---------- Nav ---------- */
  .nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    margin-top: 22px;
  }
  .nav-btn {
    width: 48px; height: 48px;
    border-radius: 50%;
    border: none;
    background: var(--paper);
    color: var(--ink);
    font-size: 20px;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .1s ease, background .15s ease;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .nav-btn:hover { background: var(--gold); }
  .nav-btn:active { transform: scale(0.92); }
  .nav-btn:disabled { opacity: 0.25; cursor: default; }

  .counter {
    color: var(--paper);
    font-size: 13px;
    font-weight: 600;
    min-width: 90px;
    text-align: center;
  }
  .counter .cur { color: var(--gold); font-weight: 800; }

  .shuffle-btn {
    background: var(--coral);
    border: none;
    color: var(--paper);
    font-size: 12.5px;
    font-weight: 700;
    padding: 10px 20px;
    border-radius: 999px;
    cursor: pointer;
    margin-top: 16px;
    align-self: center;
    transition: transform .1s ease;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .shuffle-btn:active { transform: scale(0.96); }

  @media (max-width: 420px) {
    .meta-grid { grid-template-columns: 1fr; }
    .stage { min-height: 440px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">AN COIMISIÚN LE RINCÍ GAELACHA</div>
    <h1>Ár Rincí Céilí</h1>
    <p class="subtitle">Flashcards — Concise Set</p>
  </header>

  <div class="stage">
    <div class="card" id="card">
      <div class="face front">
        <div class="spine"></div>
        <div class="front-inner">
          <div class="card-number" id="cardNum">DANCE No. 1</div>
          <div class="irish-name" id="irishName">Ballaí Luimní</div>
          <div class="divider-flourish"></div>
          <div class="english-name" id="englishName">Walls of Limerick</div>
          <div class="tap-hint" id="tapHint">TAP TO REVEAL MOVEMENTS</div>
        </div>
      </div>
      <div class="face back">
        <div class="spine"></div>
        <div class="back-inner" id="backContent"></div>
      </div>
    </div>
  </div>

  <div class="nav">
    <button class="nav-btn" id="prevBtn" aria-label="Previous">&#8592;</button>
    <div class="counter"><span class="cur" id="curIdx">1</span> / <span id="totIdx">30</span></div>
    <button class="nav-btn" id="nextBtn" aria-label="Next">&#8594;</button>
  </div>

  <button class="shuffle-btn" id="shuffleBtn">Shuffle deck</button>

</div>

nd, retain partner's hand back to place (4); swing around each other to place (8)", "16 bars", "Figure 2"], ["Finish", "An Deireadh", "Ring advance/retire (8), sidestep both ways (8+8), sidestep & swing to finish (8+8)", "40 bars", "Finish"]], "totalBars": "Standard Eight-Hand structure (Lead Around, Body, 2 Figures, Finish)", "notes": "A number of movements in this dance also appear in other eight-hand dances — note the differences and similarities.", "isHandDance": true, "bodyRepeatNote": "Side gents/couples perform each Figure after the leading tops; Body repeated between each Figure. A pause is allowed halfway through Body movement 2 (Full Chain)."}, {"num": 23, "irish": "An Port Ochtar", "english": "Eight Hand Jig", "type": "Eight-hand (Lead Around, Body, 2 Figures, Finish)", "time": "Jig time", "dancers": "Four couples", "formation": "As Eight Hand Reel", "movements": [["Lead Around", "Gabháil Timpeall", "All couples circle anti-clockwise (8), circle clockwise back (8)", "16 bars", "Lead Around"], ["1. Sides", "Na Cliatháin", "Exchange places, gents behind, rising step (4); back, gents in front (4)", "8 bars", "Body"], ["2. Skip Across", "Scinneadh Trasna", "All 4 gents advance to opposite gent's position (2), left hand turn opposite lady (2); advance to lady on right, right hand half turn (4); gents change places again (2), left hand turn (2); return to partner, right hand, full turn (4)", "16 bars", "Body"], ["3. Swing into Line", "Dhá Rang Isteach", "Couple 1 turn out, cast off with others following into line (8); both lines Rise & Grind right and left (4); partners right hand turn to place (4)", "16 bars", "Body"], ["4. Set All Around", "Fáinne Isteach is Amach", "Half turn, gents face out/ladies in (2); circle, rising step (2); full turn with lady (2); return to partner & turn (2); tops swing with couple on left (8)", "16 bars", "Body"], ["Advance and Retire", "An Chéad Fhigiúr", "Tops advance/retire (4), swing around each other (8)", "16 bars", "Figure 1"], ["Right & Left Chain / Right Hand to Opposite Lady", "An Dara Figiúr", "Chain to face centre (8); gents turn opposite lady (4), turn partner (4), link arms & turn (3), turn opposite lady (3), return to partner & turn (2); swing to place (8)", "32 bars", "Figure 2"], ["Finish", "An Deireadh", "Ring advance/retire (8), sidestep both ways (8+8), sidestep & swing to finish (8+8)", "40 bars", "Finish"]], "totalBars": "Standard Eight-Hand structure", "notes": "Jig-time counterpart to Eight Hand Reel, with its own distinct Body and Figures.", "isHandDance": true, "bodyRepeatNote": "Side couples perform each Figure after the Tops; Body repeated between each Figure."}, {"num": 24, "irish": "Lá Fhéile Phádraig", "english": "St. Patrick's Day", "type": "Eight-hand (Lead Around, Body, 2 Figures, Finish)", "time": "Jig time — danced to the tune of the same name", "dancers": "Four couples", "formation": "As Eight Hand Reel", "movements": [["Lead Around", "Gabháil Timpeall", "All couples circle anti-clockwise (8), circle clockwise back (8)", "16 bars", "Lead Around"], ["1. Sides", "Na Cliatháin", "Exchange places, gents behind, rising step (4); back, gents in front (4)", "8 bars", "Body"], ["2. Half Left and Right", "Trasna Leath-Taobh", "Right hand turn (2); tops change with side gent on left (2); tops change with side lady on left (2)", "6 bars", "Body"], ["3. Sides (repeat)", "Na Cliatháin", "Repeat movement 1 in new positions", "8 bars", "Body"], ["4. Half Left and Right (repeat)", "Trasna Leath-Taobh", "Repeat movement 2 to return to original position", "6 bars", "Body"], ["5. Double Quarter Chain", "Slabhra an Dá Cheathrún", "Right hand turn (2); left hand turn with lady on left (2+2); return to partner, full turn (2+2); left hand turn with lady on right (2+2); return, turn to place (2)", "16 bars", "Body"], ["6. Extended Sides", "Na Cliatháin", "Exchange places, gents behind, rising step (4); continue same direction (4); right hand turn & chain back to place (6)", "14 b ning"], ["Diagonal Lines and Rings", "Línte Trasnan agus Fáinne", "Top gents take partner & lady on left, trios advance diagonally (2), retire (2), repeat (4); form ring, sidestep clockwise, side gent sidesteps in (4); sidestep anti-clockwise, release into diagonal line (4); couples 1&3 and 2&4 swing around each other to place (8)", "24 bars", "Body"], ["Arches and Ring", "An Chéad Fhigiúr / Airsí agus Fáinne", "Lady of 2nd tops advances, passes under arch of 1st tops, then own arch; lady of 1st tops and lady of 2nd tops pass under in turn (8); gent of 2nd tops joins ring between ladies, sidestep anti-clockwise (4); couples pass under each other's raised arches (4); sidestep clockwise (4); swing back to own place (4)", "24 bars", "Figure 1"], ["Arches and Ring (Lady of 1st Tops)", "An Chéad Fhigiúr / Airsí agus Fáinne", "Repeat the Figure, with Lady of 1st Tops advancing to 2nd Tops", "24 bars", "Figure 1"], ["Arches and Ring (Lady of 2nd Sides)", "An Chéad Fhigiúr / Airsí agus Fáinne", "Repeat the Figure, with Lady of 2nd Sides advancing to 1st Sides", "24 bars", "Figure 1"], ["Arches and Ring (Lady of 1st Sides)", "An Chéad Fhigiúr / Airsí agus Fáinne", "Repeat the Figure, with Lady of 1st Sides advancing to 2nd Sides", "24 bars", "Figure 1"], ["Advance, Retire and Cross Over", "An Dara Figiúr / Ar Aghaidh is ar gCúl agus Trasna", "Tops advance (2), retire (2), repeat (4); ladies advance around gent on left, cross to opposite side couple, around gent, back to place (8); gents simultaneously advance around lady on right, cross to opposite side, around lady, back to place (8)", "16 bars", "Figure 2"], ["Finish", "An Deireadh", "Repeat the Opening Movement (Cross Over and Lead Around, both times through)", "32 bars", "Finish"]], "totalBars": "Body danced by Tops then Sides; Figure 1 performed by all four ladies in turn", "notes": "Originated in Co. Armagh. Forward/backward movement is not allowed during the final swing of the Body; dancing on same or opposite foot to rcle and Cross", "An Dara Figiúr / Fáinne is Lámha Isteach", "Advance & pass around opposite partner (4); right hands across (2), right hand turn to place (2); left hand turn with opposite lady (2+2), right hand turn with partner (2+2); swing to place (8)", "24 bars", "Figure 2"], ["Ladies Chain", "An Triú Figiúr / Slabhra na mBan", "Ladies chain across & back (8), swing to place (8)", "16 bars", "Figure 3"], ["Finish", "An Deireadh", "Ring advance/retire (8), sidestep both ways (8+8), sidestep & swing to finish (8+8)", "40 bars", "Finish"]], "totalBars": 568, "notes": "Originated in Co. Kerry. The longest dance in the collection at 568 bars, danced in full through all repeats of the Body and Figures.", "isHandDance": true, "bodyRepeatNote": "Opposite Tops and Side couples perform each Figure in turn; Body repeated between each Figure."}, {"num": 27, "irish": "Aoibhneas na Bealtaine", "english": "Sweets of May", "type": "Eight-hand (Opening, Body, 3 Figures, Finish)", "time": "Single jig time — danced to the tune of the same name", "dancers": "Four couples", "formation": "As Eight Hand Reel", "movements": [["Ring", "Céim an Fháinne", "Sidestep clockwise (4), back (4); anti-clockwise (4), back & release (4)", "16 bars", "Opening"], ["1. Cross Over and Back", "Athrú Áiteanna", "Tops change places, gents pass left shoulder (2); sides change likewise (2); repeat to return (4)", "8 bars", "Body"], ["2. Advance and Retire", "Ar Aghaidh is ar gCúl", "Tops advance while sides hold (2); sides advance while tops retire (2); tops advance while sides retire (2); tops retire while sides hold (2)", "8 bars", "Body"], ["3. Ringing the Bells", "Bualadh na gClog", "Beat knees & clap twice, repeat (2); change places, gents behind (4); repeat to return (8)", "16 bars", "Body"], ["Lead Around", "An Chéad Fhigiúr / Gabháil Timpeall", "All couples circle anti-clockwise (8), circle clockwise back (8)", "16 bars", "Figure 1"], ["See-Saw", "An Dara Figiúr / Luascadh Deiseal is Tuathal", "Partners take both hands uncrossed, swing around the set anti-clockwise (8); swing clockwise back to place (8) — no raising arms up and down", "16 bars", "Figure 2"], ["Sides under Arms", "An Triú Figiúr / Lámha in Airde", "Tops form arch, sides pass under & change places (2); back, sides raise arch for tops (2+4); repeat other side, arch first (8)", "16 bars", "Figure 3"], ["Ring", "Céim an Fháinne", "Repeat the Opening movement", "16 bars", "Finish"]], "totalBars": "Opening + Body + 3 Figures + Finish", "notes": "Originated in Co. Armagh.", "isHandDance": true, "bodyRepeatNote": "Body repeated between each Figure."}, {"num": 28, "irish": "Na Trí Fionn", "english": "The Three Tunes", "type": "Eight-hand", "time": "Three different tunes: Haste to the Wedding (Jig), Leslie's Hornpipe, The German Beau (Reel) — reel slower than jig, hornpipe slowest", "dancers": "Four couples", "formation": "Ring, all holding hands", "movements": [["1. Ring", "Céim an Fháinne", "All hold hands in ring, sidestep clockwise finishing two threes (4), sidestep back (4); sidestep anti-clockwise finishing two threes (4), sidestep back, release hands to place (4)", "16 bars"], ["2. Ladies and Gents Ring", "Fáinne na mBan is na bhFear", "Ladies advance to centre, form ring, dance around clockwise, release, back to place (4); clap twice (1), change places gents behind (1), sidestep back gents in front (2); repeat with gents forming the ring (8)", "16 bars"], ["3. Lead Around", "Gabháil Timpeall", "All couples circle anti-clockwise back to place (8), circle clockwise back to place (8)", "16 bars"], ["4. Stamp and Clap", "Greadadh Cos is Bos", "Stamp right, left, right (1), clap three times (1); change places gents behind (2), sidestep back gents in front (2); clap alternately 5 times on knee (1), clap three times (1); repeat whole movement (8)", "16 bars"], ["5. See-Saw", "Luascadh Deiseal is Tuathal", "Partners take both hands uncrossed, swing around the set anti-clockwise, revolving clockwise (8); swing clockwise, revolving anti-clockwise back to place (8) — no raising arms up and down", "16 bars"], ["6. Roly Poly", "An Tochras", "Hands closed at chest, roll forward (1), roll back (1); pivot right on heel, clap once (1); right fist forward & stamp right foot (1); left fist forward & stamp left foot (1); stamp right-left-right turning to partner (1); clap three times, ladies turn head right (1); change places gents behind (2), back gents in front (2)", "12 bars"], ["6b. Roly Poly (repeat)", "An Tochras", "Repeat the above Roly Poly movement in full", "12 bars"], ["7. Hook and Chain", "Crúca agus Slabhra", "Gent faces lady on left, hook left arms, turn once; gents anti-clockwise, take partner's right hand, release, take left hand of lady on right; continue chain giving right/left hands alternately until back to place, right hand turn into position", "16 bars"], ["8. Ladies and Gents Ring (repeat)", "Fáinne na mBan is na bhFear", "As movement 2 — ladies form ring, dance around clockwise, back to place; clap and change places; repeat with gents forming the ring", "16 bars"], ["9. Sides under Arms", "Lámha in Airde", "Tops raise hands to form arch, change places with couple on left, who pass under (2); release, turn in, take other inside hands (2); return to place, sides raise arch for tops to pass under, release & turn (4); repeat changing with couple on right, raising hands first (8)", "16 bars"], ["10. Stamp and Clap (repeat)", "Greadadh Cos is Bos", "As movement 4 — stamp right, left, right, clap three times; change places gents behind, back gents in front; clap alternately on knee, clap three times; repeat in full", "16 bars"], ["11. Thread the Needle", "Tríd an Chró", "All form ring except gent of 1st Tops and lady of 1st Sides; lady of 1st Sides passes under arch of 1st Tops, all others follow round anti-clockwise, lady of 1st Tops passes under own arch (8); repeat with gent of 1st Tops passing under arch of 1st Sides, dancing clockwise, gent of 1st Sides and Retire", "An Chéad Fhigiúr", "Couples 1&2 advance/retire (4), swing around each other (8); repeated by 3&4, 5&6, 7&8 in turn", "16 bars", "Figure 1"], ["Right Hand to Opposite Lady", "An Dara Figiúr / Deas Lámha Anonn", "Gents exchange hand-turns with opposite lady and partner (2+2+2+2), link arms in centre (3+3), return & swing (2+8)", "24 bars", "Figure 2"], ["Arch Arms", "An Triú Figiúr / Lámha in Airde", "Couples swing across (4), form arch to exchange ladies/gents (4), swing across again (4), form arch other way (4), swing to place (8)", "24 bars", "Figure 3"], ["Finish", "An Deireadh", "Ring advance/retire (8), sidestep both ways (8+8), sidestep & swing to finish (8+8)", "40 bars", "Finish"]], "totalBars": "Body repeated between each Figure; each Figure performed by all four couple-pairs in turn", "notes": "The most elaborate céilí dance in the collection — for eight couples in a square/diamond formation.", "isHandDance": true, "bodyRepeatNote": "Body repeated between each Figure; each Figure performed by all four couple-pairs in turn."}, {"num": 34, "isNoteCard": true, "category": "TCRG CÉILÍ TEACHING", "english": "Why Candidates Fail", "sections": [{"title": "The Core Problem", "points": ["Most failures aren't about knowledge of the movements — candidates already know the dances cold.", "The exam grades pedagogy: reading a group's level, breaking a movement into teachable pieces, cueing it clearly, and correcting dancers — not the candidate's own dancing.", "Examiners pick the dance and section on the spot, not a rehearsed favourite."]}, {"title": "Common Failure Points", "points": ["Demonstrating instead of teaching — dancing it beautifully but never breaking it down or correcting volunteers.", "Losing control of the group — letting a strong dancer dominate, or failing to manage spacing and attention.", "Skipping the lilt or count-in — no clear rhythmic entry, leading to a ragged start.", "Unclear or rushed verbal instruction — mumbled counts, vague lan <script>
  let deck = DANCES.slice();
  let index = 0;
  let flipped = false;


  const cardEl = document.getElementById('card');
  const cardNum = document.getElementById('cardNum');
  const irishName = document.getElementById('irishName');
  const englishName = document.getElementById('englishName');
  const backContent = document.getElementById('backContent');
  const curIdx = document.getElementById('curIdx');
  const totIdx = document.getElementById('totIdx');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const tapHint = document.getElementById('tapHint');


  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, m => ({
      '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
    }[m]));
  }

  function renderNoteBack(d){
    let html = `<div class="note-heading">${escapeHtml(d.english)}</div>`;
    d.sections.forEach(section => {
      html += `<div class="note-section-title">${escapeHtml(section.title)}</div>`;
      html += `<ul class="note-list">`;
      section.points.forEach(point => {
        html += `<li>${escapeHtml(point)}</li>`;
      });
      html += `</ul>`;
    });
    return html;
  }

  function renderBack(d){
    let html = '';
    html += `<div class="back-header">
      <div class="en">${escapeHtml(d.english)}</div>
      <div class="ir">${escapeHtml(d.irish)}</div>
    </div>`;

    html += `<div class="meta-grid">
      <div class="meta-item"><span class="k">TYPE</span><span class="v">${escapeHtml(d.type)}</span></div>
      <div class="meta-item"><span class="k">MUSIC</span><span class="v">${escapeHtml(d.time)}</span></div>
      <div class="meta-item full"><span class="k">DANCERS</span><span class="v">${escapeHtml(d.dancers)}</span></div>
    </div>`;

    html += `<div class="movements-label">MOVEMENTS &amp; BARS</div>`;

    let currentSection = null;
    d.movements.forEach(m => {
      const [title, irish, desc, bars, section] = m;
      if (section && section !== currentSection) {
        currentSection = section;
        html += `<div class="section-heading">${escapeHtml(section)}</div>`;
      }
      const rowClass = section ? 'movement movement-concise movement-nested' : 'movement movement-concise';
      html += `<div class="${rowClass}">
        <div class="movement-head">
          <div class="movement-title">${escapeHtml(title)}</div>
          <div class="movement-bars">${escapeHtml(bars)}</div>
        </div>
      </div>`;
    });

    if (d.bodyRepeatNote) {
      html += `<div class="body-repeat-note">${escapeHtml(d.bodyRepeatNote)}</div>`;
    }
    if (d.tuneMap) {
      html += `<div class="body-repeat-note">${escapeHtml(d.tuneMap)}</div>`;
    }

    html += `<div class="total-bars">Total: ${escapeHtml(String(d.totalBars))}</div>`;
    return html;
  }

  function render(){
    const d = deck[index];
    if (d.isNoteCard) {
      cardNum.textContent = d.category || 'STUDY NOTES';
      irishName.innerHTML = `<span class="note-front-title">${escapeHtml(d.english)}</span>`;
      englishName.textContent = '';
      backContent.innerHTML = renderNoteBack(d);
      tapHint.textContent = 'TAP TO REVEAL NOTES';
    } else {
      cardNum.textContent = `DANCE No. ${d.num}`;
      irishName.textContent = d.irish;
      englishName.textContent = d.english;
      backContent.innerHTML = renderBack(d);
      tapHint.textContent = 'TAP TO REVEAL MOVEMENTS';
    }
    curIdx.textContent = index + 1;
    totIdx.textContent = deck.length;
    prevBtn.disabled = index === 0;
    nextBtn.disabled = index === deck.length - 1;
    if(flipped){
      cardEl.classList.remove('flipped');
      flipped = false;
    }
    backContent.scrollTop = 0;
  }

  function go(delta){
    const newIndex = index + delta;
    if(newIndex < 0 || newIndex >= deck.length) return;
    index = newIndex;
    render();
  }

  cardEl.addEventListener('click', () => {
    flipped = !flipped;
    cardEl.classList.toggle('flipped', flipped);
  });

  prevBtn.addEventListener('click', (e) => { e.stopPropagation(); go(-1); });
  nextBtn.addEventListener('click', (e) => { e.stopPropagation(); go(1); });

  shuffleBtn.addEventListener('click', () => {
    for(let i = deck.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i+1));
      [deck[i], deck[j]] = [deck[j], deck[i]];
    }
    index = 0;
    render();
  });

  document.addEventListener('keydown', (e) => {
    if(e.key === 'ArrowRight') go(1);
    if(e.key === 'ArrowLeft') go(-1);
    if(e.key === ' '){ e.preventDefault(); cardEl.click(); }
  });

  render();
</script>
</body>
</html>
